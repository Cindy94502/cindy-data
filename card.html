<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cindy | 中信房屋 南崁一極店</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    /* ─── 封面圖 ─── */
    .cover {
      position: relative;
      height: 220px;
      background: linear-gradient(160deg, #c8965a 0%, #b07a3a 40%, #7a4f1e 100%);
      overflow: hidden;
    }

    /* 封面 SVG 房屋剪影 */
    .cover svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      opacity: 0.18;
    }

    /* 封面光暈 */
    .cover::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    }

    /* ─── 大頭貼 ─── */
    .profile-area {
      position: relative;
      background: #fff;
      padding-bottom: 12px;
      border-bottom: 1px solid #e4e6eb;
    }

    .avatar-wrap {
      position: absolute;
      top: -56px;
      left: 16px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
      display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* 名字與公司 */
    .profile-info {
      padding: 64px 16px 0;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      color: #050505;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .profile-sub {
      font-size: 15px;
      color: #65676b;
      margin-bottom: 10px;
    }

    /* 標籤列 */
    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tag {
      background: #e7f3ff;
      color: #1877f2;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .tag.gold {
      background: #fdf0de;
      color: #a07035;
    }

    /* 按鈕區 */
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 4px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: filter 0.15s;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(0.93); }

    .btn-blue {
      background: #1877f2;
      color: #fff;
    }

    .btn-gray {
      background: #e4e6eb;
      color: #050505;
    }

    .btn-green {
      background: #42b883;
      color: #fff;
    }

    /* ─── 資訊卡 ─── */
    .section {
      background: #fff;
      border-bottom: 1px solid #e4e6eb;
      padding: 16px;
      margin-top: 8px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #050505;
      margin-bottom: 14px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      text-decoration: none;
      color: #050505;
      border-bottom: 1px solid #f0f2f5;
    }

    .info-row:last-child { border-bottom: none; }

    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .info-text {
      flex: 1;
    }

    .info-label {
      font-size: 12px;
      color: #65676b;
      margin-bottom: 1px;
    }

    .info-value {
      font-size: 15px;
      color: #050505;
      font-weight: 500;
    }

    a.info-row .info-value {
      color: #1877f2;
    }

    .info-arrow {
      color: #bcc0c4;
      font-size: 18px;
    }

    /* ─── QR 區 ─── */
    .qr-section {
      background: #fff;
      margin-top: 8px;
      padding: 20px 16px;
      text-align: center;
      border-bottom: 1px solid #e4e6eb;
    }

    .qr-title {
      font-size: 16px;
      font-weight: 700;
      color: #050505;
      margin-bottom: 4px;
    }

    .qr-sub {
      font-size: 13px;
      color: #65676b;
      margin-bottom: 14px;
    }

    .qr-box {
      display: inline-block;
      padding: 12px;
      background: #fff;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    /* ─── 物件按鈕 ─── */
    .section-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #e7f3ff;
      color: #1877f2;
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 12px;
      transition: background 0.15s;
    }

    .section-btn:hover { background: #d8eaff; }

    /* ─── Footer ─── */
    .footer {
      background: #fff;
      margin-top: 8px;
      padding: 20px 16px;
      text-align: center;
      color: #65676b;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer strong {
      color: #1877f2;
    }
  </style>
</head>
<body>

<!-- 封面圖 -->
<div class="cover">

    <rect x="0" y="50" width="30" height="70" fill="#fff"/>

    <!-- 中樓 -->

    <!-- 小店面 -->
    <rect x="305" y="60" width="35" height="60" fill="#fff"/>

    <!-- 透天 -->
    <polygon points="345,50 360,32 375,50" fill="#fff"/>

    <!-- 大樓右側 -->
    <rect x="375" y="40" width="25" height="80" fill="#fff"/>
  </svg>
</div>

<!-- 個人資訊區 -->
<div class="profile-area">
  <div class="avatar-wrap">
    <img class="avatar" src="avatar.jpg" alt="Cindy">
  </div>

  <div class="profile-info">
    <div class="profile-name">Cindy</div>
    <div class="profile-sub">中信房屋 南崁一極店・專業不動產業務</div>
    <div class="tag-row">
      <span class="tag gold">🏡 蘆竹・南崁</span>
      <span class="tag">深耕在地</span>
    </div>
  </div>
</div>

<!-- 按鈕 -->
<div class="btn-row" style="background:#fff; padding:0 16px 16px; border-bottom:1px solid #e4e6eb;">
  <a class="btn btn-blue" href="tel:0963585690">
    📞 立即電話
  </a>
  <a class="btn btn-green" href="https://line.me/ti/p/@019nrmqw" target="_blank">
    💬 LINE 加好友
  </a>
</div>

<!-- 關於我 -->
<div class="section">
  <div class="section-title">關於我</div>

  <div class="info-row">
    <div class="info-icon">🏢</div>
    <div class="info-text">
      <div class="info-label">服務公司</div>
      <div class="info-value">中信房屋 南崁一極店</div>
    </div>
  </div>

  <div class="info-row">
    <div class="info-icon">📍</div>
    <div class="info-text">
      <div class="info-label">服務地區</div>
      <div class="info-value">桃園市 蘆竹・南崁</div>
    </div>
  </div>

  <div class="info-row">
    <div class="info-icon">🎯</div>
    <div class="info-text">
      <div class="info-label">專長</div>
      <div class="info-value">住宅買賣・電梯大樓・透天別墅</div>
    </div>
  </div>

  <a class="section-btn" href="https://cindy94502.github.io/cindy-web/properties.html" target="_blank">
    🏠 查看精選物件
  </a>
</div>

<!-- 聯絡方式 -->
<div class="section">
  <div class="section-title">聯絡方式</div>

  <a class="info-row" href="tel:0963585690">
    <div class="info-icon">📞</div>
    <div class="info-text">
      <div class="info-label">手機電話</div>
      <div class="info-value">0963-585-690</div>
    </div>
    <span class="info-arrow">›</span>
  </a>

  <a class="info-row" href="https://line.me/ti/p/@019nrmqw" target="_blank">
    <div class="info-icon">💬</div>
    <div class="info-text">
      <div class="info-label">LINE</div>
      <div class="info-value">@019nrmqw</div>
    </div>
    <span class="info-arrow">›</span>
  </a>

  <a class="info-row" href="https://cindy94502.github.io/cindy-web/properties.html" target="_blank">
    <div class="info-icon">🌐</div>
    <div class="info-text">
      <div class="info-label">物件網站</div>
      <div class="info-value">線上瀏覽所有物件</div>
    </div>

<!-- LINE QR Code -->
<div class="qr-section">
  <div class="qr-title">📲 LINE 掃描加好友</div>
  <div class="qr-sub">用手機掃描即可立即加我好友</div>
  <div class="qr-box">
    <canvas id="qrcode"></canvas>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <strong>Cindy 房仲業務</strong><br>
  中信房屋 南崁一極店<br>
  桃園市蘆竹・南崁 深耕在地
</div>

<script>
  QRCode.toCanvas(document.getElementById('qrcode'), 'https://line.me/ti/p/@019nrmqw', {
    width: 160,
    margin: 1,
    color: { dark: '#1877f2', light: '#ffffff' }
  });
</script>

</body>
</html>
