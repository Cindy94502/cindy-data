<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cindy | 中信房屋</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif;
      background: #f0ebe2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 48px;
    }

    /* ═══════════════════════════
       整張卡片
    ═══════════════════════════ */
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05), 0 20px 60px rgba(0,0,0,0.14);
      border-radius: 0 0 28px 28px;
    }

    /* ═══════════════════════════
       Hero 漸層區（含裝飾圓）
    ═══════════════════════════ */
    .hero {
      position: relative;
      background: linear-gradient(150deg, #e8973e 0%, #c46418 45%, #8b3c08 100%);
      padding: 32px 24px 96px;
      overflow: hidden;
      /* 底部曲線切割 */
      border-radius: 0 0 50% 50% / 0 0 72px 72px;
    }

    /* 裝飾圓：大 */
    .hero-blob { position: absolute; border-radius: 50%; pointer-events: none; }
    .blob-a {
      width: 300px; height: 300px;
      top: -100px; right: -70px;
      background: rgba(255,255,255,0.10);
    }
    .blob-b {
      width: 200px; height: 200px;
      bottom: -30px; left: -60px;
      background: rgba(255,255,255,0.07);
    }
    .blob-c {
      width: 130px; height: 130px;
      top: 30px; left: 20px;
      background: rgba(255,255,255,0.06);
    }
    .blob-d {
      width: 80px; height: 80px;
      top: 100px; right: 40px;
      background: rgba(255,255,255,0.08);
    }

    /* 頂部公司 tag */
    .hero-brand {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.92);
      letter-spacing: 1px;
      margin-bottom: 0;
    }

    .brand-dot { width:6px; height:6px; border-radius:50%; background:#ffe08a; flex-shrink:0; }

    /* ═══════════════════════════
       頭像（跨越 hero 和白區）
    ═══════════════════════════ */
    .avatar-anchor {
      display: flex;
      justify-content: center;
      margin-top: -80px;
      position: relative;
      z-index: 10;
    }

    .avatar-ring-outer {
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffe199, #e8973e, #c46418);
      box-shadow:
        0 0 0 5px rgba(232,151,62,0.18),
        0 12px 36px rgba(0,0,0,0.22);
    }

    .avatar-ring-inner {
      padding: 3px;
      border-radius: 50%;
      background: #fff;
    }

    .avatar {
      display: block;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ═══════════════════════════
       姓名、職稱
    ═══════════════════════════ */
    .profile-section {
      text-align: center;
      padding: 18px 24px 4px;
    }

    .profile-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px;
      font-weight: 700;
      color: #1a0e04;
      letter-spacing: 6px;
      margin-bottom: 8px;
    }

    .profile-title {
      font-size: 14px;
      font-weight: 500;
      color: #c46418;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .profile-area-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #fff5ea;
      border: 1px solid #f0d5b0;
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 500;
      color: #8a5018;
    }

    .profile-area-tag i { color: #e8973e; font-size: 11px; }

    /* ═══════════════════════════
       分隔
    ═══════════════════════════ */
    .divider {
      margin: 22px 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .div-line { flex:1; height:1px; background: linear-gradient(to right, transparent, #e8d5b8, transparent); }
    .div-icon { color: #e8973e; font-size: 12px; }

    /* ═══════════════════════════
       聯絡資訊
    ═══════════════════════════ */
    .contacts {
      padding: 18px 20px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 14px;
      border-radius: 16px;
      background: #fdf9f4;
      border: 1px solid #f0e4cc;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, transform 0.15s;
    }

    .contact-row:active { background: #f7eed8; transform: scale(0.985); }

    .c-icon {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: #fff; flex-shrink: 0;
    }
    .ci-phone { background: linear-gradient(145deg, #e8973e, #b46018); }
    .ci-line  { background: linear-gradient(145deg, #06c755, #019d3e); }
    .ci-web   { background: linear-gradient(145deg, #5898da, #3070b0); }

    .c-text { flex: 1; min-width: 0; }
    .c-label { font-size: 11px; color: #b0906a; margin-bottom: 2px; letter-spacing: 0.4px; }
    .c-value { font-size: 16px; font-weight: 600; color: #1a0e04; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-arrow { color: #d8c8a8; font-size: 14px; flex-shrink: 0; }

    /* ═══════════════════════════
       CTA 按鈕
    ═══════════════════════════ */
    .cta-row {
      padding: 16px 20px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cta {
      height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.15s;
    }
    .cta:active { opacity: 0.83; transform: scale(0.97); }
    .cta i { font-size: 16px; }

    .cta-call  { background: linear-gradient(135deg, #e8973e, #b46018); color: #fff; }
    .cta-line  { background: linear-gradient(135deg, #06c755, #019d3e); color: #fff; }

    /* ═══════════════════════════
       QR Code
    ═══════════════════════════ */
    .qr-area {
      margin: 0 20px 24px;
      background: linear-gradient(135deg, #fff8ef, #fff2e2);
      border: 1px solid #f0d8b0;
      border-radius: 22px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-title {
      font-size: 14px;
      font-weight: 600;
      color: #2a1806;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
    }

    .qr-sub {
      font-size: 12px;
      color: #a88050;
      margin-bottom: 16px;
    }

    .qr-frame {
      padding: 10px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .qr-tag {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(232,151,62,0.12);
      border: 1px solid rgba(232,151,62,0.25);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #8a4e10;
    }

    /* ═══════════════════════════
       Footer
    ═══════════════════════════ */
    .card-footer {
      background: linear-gradient(150deg, #e8973e 0%, #c46418 45%, #8b3c08 100%);
      padding: 16px 20px;
      text-align: center;
    }

    .footer-brand { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.95); letter-spacing: 1px; margin-bottom: 3px; }
    .footer-sub   { font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 0.8px; }
  </style>
</head>
<body>
