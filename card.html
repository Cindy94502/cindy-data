<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cindy | 中信房屋</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* 全版滿屏，最大寬 430px 置中 */
    html, body {
      min-height: 100%;
      background: #f4f1e8;
    }

    body {
      font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif;
      max-width: 430px;
      margin: 0 auto;
      background: #faf9f5;
    }

    /* ══════════════════════════════
       封面區（鼠尾草綠漸層）
    ══════════════════════════════ */
    .cover {
      position: relative;
      width: 100%;
      height: 200px;
      background: linear-gradient(155deg, #7c9e7a 0%, #527254 45%, #3c5a3e 100%);
      overflow: hidden;
    }

    /* 封面底部輕柔曲線 */
    .cover::after {
      content: '';
      position: absolute;
      bottom: -2px; left: -5%; right: -5%;
      height: 48px;
      background: #faf9f5;
      border-radius: 60% 60% 0 0;
    }

    /* 封面植物插畫 */
    .cover-botanical {
      position: absolute;
      bottom: 20px; right: -10px;
      width: 190px;
      opacity: 0.13;
      pointer-events: none;
    }

    .cover-botanical-left {
      position: absolute;
      top: 10px; left: -10px;
      width: 130px;
      opacity: 0.09;
      pointer-events: none;
      transform: scaleX(-1) rotate(15deg);
    }

    /* 公司標籤 */
    .cover-brand {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 30px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.88);
      letter-spacing: 1px;
    }

    .brand-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #d4e8b0;
      flex-shrink: 0;
    }

    /* ══════════════════════════════
       大頭貼（跨越封面與白區）
    ══════════════════════════════ */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -68px;
      position: relative;
      z-index: 10;
    }

    .avatar-outer {
      position: relative;
      display: inline-block;
    }

    /* 虛線外圈 — 手繪感 */
    .avatar-outer::before {
      content: '';
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255,255,255,0.55);
    }

    .avatar {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #faf9f5;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    /* ══════════════════════════════
       姓名區
    ══════════════════════════════ */
    .profile-section {
      padding: 14px 20px 6px;
      text-align: center;
    }

    .profile-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-style: italic;
      font-weight: 600;
      color: #2a2218;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .profile-company {
      font-family: 'Noto Serif TC', serif;
      font-size: 12px;
      color: #8a7a62;
      letter-spacing: 2.5px;
      margin-bottom: 4px;
    }

    .profile-title {
      font-size: 12px;
      color: #6a8668;
      letter-spacing: 1.5px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .location-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(106,134,104,0.35);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      color: #527254;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .location-tag i { font-size: 10px; }

    /* ══════════════════════════════
       分隔（植物小插畫）
    ══════════════════════════════ */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px;
      margin: 18px 0 0;
    }

    .div-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(140,120,100,0.18), transparent);
    }

    .div-leaf {
      font-size: 14px;
      color: rgba(106,134,104,0.5);
      line-height: 1;
    }

    /* ══════════════════════════════
       引言（文青 italic）
    ══════════════════════════════ */
    .quote-section {
      padding: 16px 28px;
      text-align: center;
    }

    .quote-text {
      font-size: 13px;
      font-style: italic;
      color: #7a6a56;
      line-height: 1.9;
      font-family: 'Noto Serif TC', serif;
    }

    /* ══════════════════════════════
       關於我（區塊標題）
    ══════════════════════════════ */
    .info-section {
      padding: 0 20px;
      margin-bottom: 4px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #b0a080;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding: 18px 0 0;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(140,120,100,0.1);
    }

    .info-row:first-of-type { border-top: 1px solid rgba(140,120,100,0.1); }

    .info-icon {
      width: 20px;
      text-align: center;
      color: #6a8668;
      font-size: 14px;
      padding-top: 1px;
      flex-shrink: 0;
    }

    .info-text { flex: 1; }
    .info-label { font-size: 10px; color: #b0a080; letter-spacing: 0.8px; margin-bottom: 2px; }
    .info-value { font-size: 14px; font-weight: 500; color: #2a2218; line-height: 1.4; }

    /* ══════════════════════════════
       聯絡方式
    ══════════════════════════════ */
    .contact-section {
      padding: 0 20px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(140,120,100,0.1);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
    }

    .contact-row:first-of-type { border-top: 1px solid rgba(140,120,100,0.1); }

    .contact-row:active { background: rgba(106,134,104,0.05); }

    .c-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .ci-phone { background: #eef2ea; color: #527254; }
    .ci-line  { background: #e6f5ec; color: #0a9640; }
    .ci-web   { background: #eaeff5; color: #4a6890; }

    .c-text { flex: 1; min-width: 0; }
    .c-label { font-size: 10px; color: #b0a080; letter-spacing: 0.8px; margin-bottom: 2px; }
    .c-value { font-size: 15px; font-weight: 600; color: #2a2218; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-arrow { color: #d0c8b8; font-size: 13px; }

    /* ══════════════════════════════
       行動按鈕
    ══════════════════════════════ */
    .cta-section {
      padding: 18px 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cta-btn {
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.15s;
    }

    .cta-btn:active { opacity: 0.8; transform: scale(0.97); }

    .btn-phone {
      background: #3c5a3e;
      color: #fff;
    }

    .btn-line {
      background: #06c755;
      color: #fff;
    }

    /* ══════════════════════════════
       精選物件連結
    ══════════════════════════════ */
    .property-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 20px 24px;
      height: 48px;
      border-radius: 12px;
      border: 1.5px solid rgba(106,134,104,0.4);
      color: #527254;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }

    .property-btn:active { background: rgba(106,134,104,0.06); }

    /* ══════════════════════════════
       Footer（植物裝飾）
    ══════════════════════════════ */
    .card-footer {
      background: linear-gradient(155deg, #7c9e7a 0%, #527254 45%, #3c5a3e 100%);
      padding: 24px 20px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .footer-botanical {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.08;
      pointer-events: none;
    }

    .footer-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      letter-spacing: 2px;
      margin-bottom: 5px;
      position: relative;
    }

    .footer-company {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1.5px;
      position: relative;
    }
  </style>
</head>
