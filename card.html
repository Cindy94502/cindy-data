<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cindy | 中信房屋 南崁一極店</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { min-height: 100%; }

    body {
      font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif;
      min-height: 100vh;
      background-color: #e9e2d8;
      background-image:
        radial-gradient(ellipse 75% 55% at 10% 0%,   rgba(215, 192, 155, 0.75) 0%, transparent 65%),
        radial-gradient(ellipse 60% 70% at 92% 95%,  rgba(196, 168, 128, 0.65) 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 72% 15%,  rgba(232, 214, 185, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 45% 55% at 25% 80%,  rgba(178, 154, 118, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 35% 35% at 55% 55%,  rgba(220, 205, 178, 0.30) 0%, transparent 55%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 20px 48px;
      overflow-x: hidden;
    }

    /* ── 裝飾背景圓 ── */
    .deco-circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .deco-circle-1 {
      width: 300px; height: 300px;
      top: -80px; left: -80px;
      background: radial-gradient(circle, rgba(210,185,148,0.4) 0%, transparent 70%);
    }
    .deco-circle-2 {
      width: 250px; height: 250px;
      bottom: -60px; right: -60px;
      background: radial-gradient(circle, rgba(190,162,120,0.45) 0%, transparent 70%);
    }

    /* ── 主容器 ── */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── 大頭貼 ── */
    .avatar-wrap {
      margin-bottom: 22px;
    }

    .avatar-ring {
      display: inline-block;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, #d9b478, #c2894e, #d9b478);
      box-shadow:
        0 0 0 6px rgba(210,180,140,0.18),
        0 12px 36px rgba(0,0,0,0.14);
    }

    .avatar {
      display: block;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
    }

    /* ── 姓名與公司 ── */
    .profile-name {
      font-size: 32px;
      font-weight: 700;
      color: #231d17;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(200,165,110,0.13);
      border: 1px solid rgba(200,165,110,0.28);
      border-radius: 30px;
      padding: 5px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #7a5522;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .profile-badge i {
      font-size: 11px;
      opacity: 0.7;
    }

    .profile-title {
      font-size: 14px;
      color: #8e7d6e;
      font-weight: 400;
      margin-bottom: 22px;
      letter-spacing: 1px;
    }

    /* ── 分隔線 ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(168,145,115,0.3), transparent);
    }
    .divider-icon {
      color: rgba(168,145,115,0.5);
      font-size: 10px;
    }

    /* ── 簡介 ── */
    .bio {
      font-size: 14px;
      line-height: 1.8;
      color: #6e5e50;
      text-align: center;
      padding: 0 6px;
      margin-bottom: 30px;
    }

    /* ── 按鈕區 ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
      width: 100%;
      margin-bottom: 30px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(210, 190, 162, 0.28);
      border-radius: 60px;
      padding: 7px 18px 7px 7px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 3px 16px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.7);
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s, background 0.2s;
    }

    .link-btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.80);
      box-shadow: 0 8px 28px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .link-btn:active {
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 16px;
      font-size: 21px;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .btn-text-wrap {
      flex: 1;
      text-align: left;
    }

    .btn-label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #231d17;
      line-height: 1.25;
      margin-bottom: 2px;
    }

    .btn-sub {
      display: block;
      font-size: 12px;
      color: #9e8e80;
      font-weight: 400;
    }

    .btn-arrow {
      color: #ccc;
      font-size: 15px;
      margin-left: 6px;
    }

    /* 各按鈕顏色 */
    .btn-phone  .btn-icon { background: linear-gradient(145deg, #d0884a, #a86030); }
    .btn-line   .btn-icon { background: linear-gradient(145deg, #06c755, #00a040); }
    .btn-web    .btn-icon { background: linear-gradient(145deg, #7098c8, #4a70a8); }

    /* ── QR Code 區 ── */
    .qr-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(210, 190, 162, 0.25);
      border-radius: 28px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.65);
    }

    .qr-title {
      font-size: 15px;
      font-weight: 600;
      color: #2d2520;
      margin-bottom: 4px;
    }

    .qr-sub {
      font-size: 12px;
      color: #9e8e80;
      margin-bottom: 16px;
    }

    .qr-canvas-wrap {
      display: inline-block;
      padding: 10px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .qr-id {
      margin-top: 12px;
      font-size: 13px;
      color: #7a6a5c;
      letter-spacing: 0.5px;
    }

    /* ── 頁尾 ── */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: rgba(100, 88, 76, 0.45);
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <!-- 裝飾背景 -->
  <div class="deco-circle deco-circle-1"></div>
  <div class="deco-circle deco-circle-2"></div>

  <div class="container">

    <!-- 大頭貼 -->
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <img class="avatar" src="avatar.jpg" alt="Cindy">
      </div>
    </div>

    <!-- 姓名 -->
    <div class="profile-name">Cindy</div>

    <div class="profile-badge">
      <i class="fa-solid fa-building-columns"></i>
      中信房屋 南崁一極店
    </div>

    <div class="profile-title">專業不動產業務 &nbsp;·&nbsp; 蘆竹・南崁</div>

    <!-- 分隔 -->
    <div class="divider">
      <div class="divider-line"></div>
      <i class="fa-solid fa-house-chimney divider-icon"></i>
      <div class="divider-line"></div>
    </div>

    <!-- 簡介 -->
    <p class="bio">
      用心陪伴每一個尋家的旅程<br>
      深耕蘆竹・南崁多年<br>
      讓找房這件事，變得溫暖而簡單
    </p>

    <!-- 聯絡按鈕 -->
    <div class="links">

      <a class="link-btn btn-phone" href="tel:0963585690">
        <div class="btn-icon">
          <i class="fa-solid fa-phone"></i>
        </div>
        <div class="btn-text-wrap">
          <span class="btn-label">0963-585-690</span>
          <span class="btn-sub">點擊立即通話</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

      <a class="link-btn btn-line" href="https://line.me/ti/p/@019nrmqw" target="_blank">
        <div class="btn-icon">
          <!-- LINE SVG logo -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.07 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
          </svg>
        </div>
        <div class="btn-text-wrap">
          <span class="btn-label">LINE 加好友</span>
          <span class="btn-sub">@019nrmqw</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

      <a class="link-btn btn-web" href="https://cindy94502.github.io/cindy-web/properties.html" target="_blank">
        <div class="btn-icon">
          <i class="fa-solid fa-house"></i>
        </div>
        <div class="btn-text-wrap">
          <span class="btn-label">精選物件</span>
          <span class="btn-sub">線上瀏覽所有在售物件</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

    </div>

    <!-- LINE QR Code -->
    <div class="qr-card">
      <div class="qr-title">掃描加入 LINE 好友</div>
      <div class="qr-sub">開啟相機對準 QR Code 即可</div>
      <div class="qr-canvas-wrap">
        <canvas id="qrcode"></canvas>
      </div>
      <div class="qr-id">LINE ID &nbsp;·&nbsp; @019nrmqw</div>
    </div>

    <!-- 頁尾 -->
    <div class="footer">
      中信房屋 南崁一極店<br>
      桃園市 蘆竹・南崁 深耕在地服務
    </div>

  </div>

  <script>
    QRCode.toCanvas(document.getElementById('qrcode'), 'https://line.me/ti/p/@019nrmqw', {
      width: 160,
      margin: 1,
      color: { dark: '#231d17', light: '#ffffff' }
    });
  </script>

</body>
</html>
